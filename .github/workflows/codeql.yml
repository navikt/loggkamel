name: CodeQL

on:
  schedule:
    - cron: '32 13 * * 1'

jobs:
  analyze-java:
    name: Analyze Java
    runs-on: ubuntu-latest-8-cores
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          # https://github.com/actions/setup-java/blob/main/README.md#Supported-distributions
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: 'java'

      - name: Build Java
        run: ./mvnw clean install -P github-actions -DskipTests=true --threads=2 --batch-mode --settings ./.mvn/settings.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:java"

name: Build and deploy main
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"

jobs:
  test-build-deploy:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      actions: read
      contents: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/build-and-push.yml
  deploy:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: test-build-deploy
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ matrix.cluster }}
      queue: max
    strategy:
      matrix:
        cluster: [ dev-gcp ]
    name: Deploy to ${{ matrix.cluster }}
    environment: ${{ matrix.cluster }}:sikkerhetstjenesten
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        env:
          PRINT_PAYLOAD: true
          RESOURCE: .nais/naiserator.yaml
          CLUSTER: ${{ matrix.cluster }}
          VARS: .nais/${{matrix.cluster}}.json
          IMAGE: ${{ needs.test-build-deploy.outputs.image }}
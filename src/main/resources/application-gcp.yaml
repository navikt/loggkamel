management:
  info:
    git:
      mode: simple
  observations:
    annotations:
      enabled: true
  health:
    ssl:
      enabled: false
    ping:
      enabled: false
    diskspace:
      enabled: false
  endpoints:
    web:
      base-path: /monitoring
      exposure:
        include: health,info,prometheus

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: loggkamel
  datasource:
    url: ${db.jdbc.url}
    username: ${db.username}
    password: ${db.password}
    hikari:
      connection-timeout: 5000
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-test-query: SELECT 1
      maximum-pool-size: ${db.poolsize:10}
      minimum-idle: 0

logging:
  level:
    # Set to WARN to avoid leaking connection information in startup logs
    org.hibernate.orm.connections.pooling: WARN

entra-proxy:
  namespace: "sikkerhetstjenesten"
  app-name: "entra-proxy"

loggkamel-proxy:
  namespace: "sikkerhetstjenesten"
  app-name: "loggkamel-proxy"

springdoc:
  swagger-ui:
    oauth:
      client-id: ${azure.app.client.id}
    csrf:
      enabled: true

# Executor pool for parallel log line publishing
# On GCP, we can use more aggressive defaults than local development
executor:
  logPacketPublish:
    corePoolSize: 8
    maxPoolSize: 16
    queueSize: 500
    keepAliveSeconds: 60

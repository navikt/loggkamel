LOGGKAMEL_PROXY_BASE_URL: https://loggkamel-proxy.prod-fss-pub.nais.io

entra-proxy:
  cluster: prod-gcp

loggkamel-proxy:
  cluster: prod-fss

routing:
  postgres:
    consumer: "google-storage://loggkamel-prod-postgresql-consumer?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-postgresql-invalid-message"
    invalid-message-routing: ${routing.postgres.consumer}
  packet:
    bucket: "google-storage://loggkamel-prod-logglines?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-logglines-invalid-message"
    invalid-message-routing: ${routing.packet.bucket}


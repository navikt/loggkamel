LOGGKAMEL_PROXY_BASE_URL: https://loggkamel-proxy.prod-fss-pub.nais.io

entra-proxy:
  cluster: prod-gcp

loggkamel-proxy:
  cluster: prod-fss

routing:
  postgres:
    consumer-bucket-name: "loggkamel-prod-postgresql-consumer"
    consumer: "google-storage://${routing.postgres.consumer-bucket-name}?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-postgresql-invalid-message"
  packet:
    bucket-name: "loggkamel-prod-logglines"
    bucket: "google-storage://${routing.packet.bucket-name}?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-logglines-invalid-message"

auth:
  admin-teams:
    - sikkerhetstjenesten

scheduled:
  backfill:
    cron: "0 0 3 * * *"
  idempotent-repository:
    cleanup:
      postgres-retention-minutes: 360
      log-packet-retention-minutes: 10
  db2:
    pull:
      cron: "0 0 8 * * *"
  cold-storage:
    cron: "0 30 3 * * *"

cold-storage:
  project-id: "nav-audit-logs"
  bucket-name: "nav-audit-log-archive-bucket"
  environment: "prod-gcp"

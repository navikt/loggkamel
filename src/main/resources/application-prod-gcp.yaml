LOGGKAMEL_PROXY_BASE_URL: https://loggkamel-proxy.prod-fss-pub.nais.io

entra-proxy:
  cluster: prod-gcp

loggkamel-proxy:
  cluster: prod-fss

routing:
  postgres:
    consumer: "google-storage://loggkamel-prod-postgresql-consumer?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-postgresql-invalid-message"
  packet:
    bucket-name: "loggkamel-prod-logglines"
    bucket: "google-storage://${routing.packet.bucket-name}?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-prod-logglines-invalid-message"

pull-rerun:
  admin-teams:
    - sikkerhetstjenesten

scheduled:
  idempotent-repository:
    cleanup:
      postgres-retention-minutes: 360
      log-packet-retention-minutes: 10
  db2:
    backfill:
      cron: "0 0 3 * * *"
    pull:
      cron: "0 0 8 * * *"

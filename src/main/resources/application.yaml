logging:
  level:
    root: info

app:
  # Single source of truth for the timezone used across scheduling, date
  # calculations and (via the container's TZ env var) the JVM default.
  # Falls back to Europe/Oslo when TZ isn't set (e.g. local dev outside Docker).
  timezone: ${TZ:Europe/Oslo}

spring:
  jpa:
    open-in-view: false
  main:
    keep-alive: true
  task:
    execution:
      simple:
        # Bound async work when virtual threads are enabled.
        concurrency-limit: 20

ENTRA_PROXY_BASE_URL: http://entra-proxy
NAIS_CONSOLE_BASE_URL: https://console.nav.cloud.nais.io/graphql

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

scheduled:
  idempotent-repository:
    cleanup:
      cron: "0 */5 * * * *"
  route:
    control:
      cron: "0 * * * * *"

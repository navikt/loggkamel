spring:
  mvc:
    log-request-details: true
management:
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: '*'
  httpexchanges:
    recording:
      enabled: true

LOGGKAMEL_PROXY_BASE_URL: https://loggkamel-proxy.dev-fss-pub.nais.io

entra-proxy:
  cluster: dev-gcp

loggkamel-proxy:
  cluster: dev-fss

routing:
  postgres:
    consumer: "google-storage://loggkamel-dev-postgresql-consumer?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-dev-postgresql-invalid-message"
    invalid-message-routing: ${routing.postgres.consumer}
  packet:
    bucket-name: "loggkamel-dev-logglines"
    bucket: "google-storage://${routing.packet.bucket-name}?deleteAfterRead=false&exceptionHandler=#gcpConsumerPollingExceptionHandler&includeBody=false"
    invalid-message: "loggkamel-dev-logglines-invalid-message"
    invalid-message-routing: ${routing.packet.bucket}

debug: false


spring:
  cache:
    type: caffeine
  datasource:
    url: ${LOCAL_DB_JDBC_URL:jdbc:postgresql://localhost:5432/loggkamel}
    username: ${LOCAL_DB_USERNAME:${USER}}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-test-query: SELECT 1
      maximum-pool-size: 5
  flyway:
    enabled: false

management:
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      base-path: /monitoring
      exposure:
        include: '*'
  httpexchanges:
    recording:
      enabled: true

routing:
  postgres:
    consumer: "file:src/main/resources/files/postgres"
    invalid-message: "file:src/main/resources/files/postgres/invalid-messages"
    invalid-message-routing: ${routing.postgres.invalid-message}
  packet:
    bucket-name: "src/main/resources/files/intermediate"
    bucket: "file:${routing.packet.bucket-name}"
    invalid-message: "file:src/main/resources/files/intermediate/invalid-messages"
    invalid-message-routing: ${routing.packet.invalid-message}
  logline:
    producer: "file:src/main/resources/files/output"

executor:
  logPacketPublish:
    # Conservative defaults for local development to avoid overwhelming single machine
    corePoolSize: 2
    maxPoolSize: 4
    queueSize: 500
    keepAliveSeconds: 30

